[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tasteq"
version = "0.1.0"
description = "An equalizer that learns your personal sound preference from A/B comparisons."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rafael Guerra Waldrigues", email = "waldriguesrafa@gmail.com" }]
keywords = ["equalizer", "audio", "preference-learning", "bayesian-optimization", "gaussian-process"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    "soundfile>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "botorch>=0.11", "gpytorch>=1.11", "matplotlib>=3.8"]
audio = ["librosa>=0.10", "sounddevice>=0.4"]
demo = ["gradio>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "types-PyYAML",
    "scipy-stubs",
]

[project.scripts]
tasteq = "tasteq.cli:app"

[project.urls]
Repository = "https://github.com/Rafawaldrigues/tasteq"

[tool.hatch.build.targets.wheel]
packages = ["src/tasteq"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF", "PT", "D"]
ignore = ["D105", "D107", "D203", "D213", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["tasteq"]

[[tool.mypy.overrides]]
module = ["pyloudnorm.*", "soundfile.*", "librosa.*", "sounddevice.*", "gradio.*", "botorch.*", "gpytorch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running tests (benchmarks, large property sweeps)"]

[tool.coverage.run]
source = ["tasteq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
