name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # CPU wheels keep the install small; nothing in tasteq needs a GPU.
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,ml,audio]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,ml,audio]"
      - run: pytest --cov --cov-report=term --cov-report=xml
        env:
          HYPOTHESIS_PROFILE: ci

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml]"
      - run: tasteq bench --config configs/ci.yaml --out results --workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: bench-ci
          path: results/ci
