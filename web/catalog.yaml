# Music used in phase 2 and in the blind test of the web study.
#
# 28 tracks from the Free Music Archive (20 x CC BY 4.0, 8 x CC0 1.0), as
# listed on FMA when checked on 2026-11-18. `file` is the name inside
# TASTEQ_MUSIC_DIR; the audio itself is never committed.
#
# `style` is the coarse group participants choose from; `genre` is the finer
# description shown in the credits. `explicit` flags tracks FMA marks as
# radio-unsafe or with possibly explicit language; `ai_generated` flags the
# track FMA reports as (partly) AI-generated, so analyses can set it apart.
# CC BY requires credit, a license link and an indication of changes: the
# site shows all three next to every track and on the credits page.
# `notes` are shown on the credits page; `internal_notes` never leave the server.

