# Tiny smoke benchmark for CI: proves the pipeline runs end to end in about a minute.
name: ci
seeds: 2
n_comparisons: 10
eval_every: 5
context_dim: 2
n_tracks: 5
n_eval_contexts: 2
n_heldout_pairs: 100
personas: [bass_lover, bimodal]
models:
  - {name: random, kind: random}
  - {name: gp, kind: gp, params: {num_restarts: 2, raw_samples: 64}}
  - {name: neural, kind: neural, params: {n_members: 3, epochs: 50}}
