# Main experiment: every model against every persona.
# 100 comparisons covers calibration (~40) plus a stretch of everyday use,
# long enough to see whether the neural model catches up with more data.
name: main
seeds: 10
n_comparisons: 100
eval_every: 10
context_dim: 2
n_tracks: 10
n_eval_contexts: 6
n_heldout_pairs: 300
models:
  - {name: random, kind: random}
  - {name: gp, kind: gp}
  - {name: neural, kind: neural}
